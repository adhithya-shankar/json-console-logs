[versions]
# libraries
junit = "4.13.2"
junit-jupiter-api="5.11.4"
mockito-core = "5.14.2"

# plugins
changelog = "2.2.1"
intelliJPlatform = "2.2.1"
qodana = "2024.3.4"
kover = "0.9.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
junitJupiterApi = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter-api" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito-core" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover"}
